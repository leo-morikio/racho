<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rachô">
  <defs>
    <clipPath id="dropClip">
      <path d="M32 4C32 4 54 28 54 40a22 22 0 0 1-44 0C10 28 32 4 32 4Z"/>
    </clipPath>
  </defs>

  <!-- gota dividida: metade laranja, metade azul-petroleo -->
  <g clip-path="url(#dropClip)">
    <rect x="0" y="0" width="32" height="64" fill="#FF6B35"/>
    <rect x="32" y="0" width="32" height="64" fill="#1B4965"/>
  </g>

  <!-- contorno e a "rachadura" central -->
  <path d="M32 4C32 4 54 28 54 40a22 22 0 0 1-44 0C10 28 32 4 32 4Z"
        fill="none" stroke="#F7F7F7" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 6v56" stroke="#F7F7F7" stroke-width="3" stroke-linecap="round"/>

  <!-- seta: a estrada seguindo em frente -->
  <path d="M22 40h20m-7-7 7 7-7 7"
        fill="none" stroke="#F7F7F7" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
